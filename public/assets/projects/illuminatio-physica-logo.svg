  <text x="94" y="51" fill="#e8f1ff" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.8">Illuminatio Physica</text>
  <text x="95" y="70" fill="#61d7de" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2">3D PHYSICS KNOWLEDGE GRAPH</text>
