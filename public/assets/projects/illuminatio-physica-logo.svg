      <circle cx="53" cy="43" r="3"/>
    </g>
    <g fill="#b9e4d1">
      <circle cx="43" cy="11" r="3"/>
      <circle cx="21" cy="53" r="3"/>
    </g>
    <circle cx="32" cy="32" r="5" fill="#f2d58a"/>
