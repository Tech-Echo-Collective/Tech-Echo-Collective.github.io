<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 96" role="img" aria-labelledby="title desc">
  <title id="title">Illuminatio Physica</title>
  <desc id="desc">The Illuminatio Physica projected-orbit symbol and horizontal wordmark.</desc>
  <rect width="540" height="96" rx="18" fill="#01040a"/>
  <g transform="translate(8 16)">
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <ellipse cx="32" cy="32" rx="24" ry="9" stroke="#61d7de" transform="rotate(28 32 32)"/>
      <ellipse cx="32" cy="32" rx="9" ry="24" stroke="#b9e4d1" transform="rotate(28 32 32)"/>
    </g>
    <g fill="#61d7de">
